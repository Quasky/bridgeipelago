name: Check

on:
  push:
    branches: [awepeeps-patches]
  pull_request:
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install dependencies
        run: just install
      - name: Run the required checks
        run: just check

  hooks:
    name: hooks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        uses: jdx/mise-action@924e7c586e33d7d4bae9c14e26c5d22e2beb6e78 # v5.3.0
      - name: Install the hook shims and fetch the shared config
        # `install` is what fetches the public `hooks-v3` tag into
        # `.git/info/lefthook-remotes`; `validate` alone silently skips remotes.
        run: lefthook install
      - name: Assert the shared jobs merged
        run: |
          dump=$(lefthook dump)
          for job in core-fmt core-forbidden-files core-policy owner-public-data; do
            grep -q "name: $job" <<<"$dump" || {
              echo "::error::the shared hook config did not load job $job"
              exit 1
            }
          done
      - name: Validate the merged config
        run: lefthook validate
